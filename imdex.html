<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 禁止手机页面缩放 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>贪吃蛇 · Snake</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #1e293b 0%, #020617 70%);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e2e8f0;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .game {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 420px;
    padding: 10px;
  }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 14px;
    color: #94a3b8;
    letter-spacing: .5px;
  }
  .hud strong {
    color: #4ade80;
    font-size: 20px;
    margin-left: 6px;
    font-variant-numeric: tabular-nums;
  }

  canvas {
    display: block;
    width: 100%;
    max-width: 400px;
    height: auto;
    aspect-ratio: 1 / 1;
    margin: 0 auto;
    border-radius: 12px;
    background: #0b1220;
    box-shadow: 0 0 0 1px rgba(148, 163, 184, .18), 0 18px 40px rgba(0, 0, 0, .55);
    touch-action: none;
  }

  /* ==================== 四方向按键 ==================== */
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 8px;
    justify-content: center;
    margin: 4px auto 0;
  }

  .dpad-btn[data-dir="up"]    { grid-column: 2; grid-row: 1; }
  .dpad-btn[data-dir="left"]  { grid-column: 1; grid-row: 2; }
  .dpad-btn[data-dir="right"] { grid-column: 3; grid-row: 2; }
  .dpad-btn[data-dir="down"]  { grid-column: 2; grid-row: 3; }

  .dpad-btn {
    width: 56px;
    height: 56px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    line-height: 1;
    color: #4ade80;
    background: #1e293b;
    border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 12px;
    cursor: pointer;
    touch-action: manipulation;
    transition: background .1s ease, transform .06s ease;
  }
  .dpad-btn:hover  { background: #243449; }
  .dpad-btn:active { background: #334155; transform: scale(.94); }
  .dpad-btn.pressed {
    background: #334155;
    transform: scale(.94);
  }

  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  button {
    padding: 9px 18px;
    font-size: 14px;
    font-family: inherit;
    color: #052e16;
    background: linear-gradient(180deg, #86efac, #4ade80);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: transform .08s ease, filter .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  button:hover { filter: brightness(1.06); }
  button:active { transform: translateY(1px) scale(.98); }

  .tip {
    font-size: 12px;
    color: #64748b;
    text-align: right;
    line-height: 1.5;
  }
</style>
</head>
<body>

  <div class="game">
    <header class="hud">
      <div>分数<strong id="score">0</strong></div>
      <div>最高分<strong id="best">0</strong></div>
    </header>

    <canvas id="game" width="400" height="400"></canvas>

    <!-- 四方向按键 -->
    <div class="dpad">
      <button class="dpad-btn" data-dir="up"    aria-label="向上">▲</button>
      <button class="dpad-btn" data-dir="left"  aria-label="向左">◀</button>
      <button class="dpad-btn" data-dir="right" aria-label="向右">▶</button>
      <button class="dpad-btn" data-dir="down"  aria-label="向下">▼</button>
    </div>

    <footer class="bar">
      <button id="restart">重新开始</button>
      <span class="tip">方向键 / 滑动屏幕控制<br>空格暂停/继续</span>
    </footer>
  </div>

<script>
(function () {
  'use strict';

  /* =========================================================
   *  1. 基础配置
   * ========================================================= */
  const COLS = 20;
  const ROWS = 20;
  const CELL = 20;
  const STEP_TIME = 150;
  const BEST_KEY = 'snake_best_score';

  /* =========================================================
   *  1.5 音效配置与工具 (Web Audio API)
   * ========================================================= */
  let audioCtx = null;

  /**
   * 初始化 / 解锁 AudioContext
   * 现代浏览器要求必须在用户手势（键盘、触屏、点击）后
   * 才能创建或 resume AudioContext，否则会被拦截。
   */
  function initAudio() {
    if (!audioCtx) {
      // 兼容不同浏览器
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return; // 极老旧浏览器直接跳过
      audioCtx = new AudioContext();
    }
    // 如果处于挂起状态，恢复运行
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  /**
   * 通用 8-bit 音效播放函数
   * @param {string} type - 波形类型: 'square' | 'sawtooth' | 'sine' | 'triangle'
   * @param {number} startFreq - 起始频率 (Hz)
   * @param {number} endFreq - 结束频率 (Hz)，传入 null 表示不改变音调
   * @param {number} duration - 持续时间 (秒)
   * @param {number} volume - 音量 (0.0 ~ 1.0)，默认 0.1
   */
  function playSound(type, startFreq, endFreq, duration, volume = 0.1) {
    if (!audioCtx) return; // 未初始化则直接跳过

    const now = audioCtx.currentTime;

    // 创建振荡器（产生声音波形）
    const osc = audioCtx.createOscillator();
    osc.type = type;

    // 创建增益节点（控制音量，避免爆音）
    const gainNode = audioCtx.createGain();

    // 连接节点：振荡器 -> 增益 -> 扬声器
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    // 设置频率
    osc.frequency.setValueAtTime(startFreq, now);
    if (endFreq !== null && endFreq !== undefined) {
      // 指数渐变产生滑音效果（注意：数值不能为0）
      osc.frequency.exponentialRampToValueAtTime(endFreq, now + duration);
    }

    // 设置音量包络：立即起音，然后指数衰减至接近0，避免结尾“咔哒”声
    gainNode.gain.setValueAtTime(volume, now);
    gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);

    // 启动并停止
    osc.start(now);
    osc.stop(now + duration);
  }

  /** 吃到食物音效：短促清脆的“哔”声（方波，高音） */
  function playEatSound() {
    // 方波(square)最有8-bit味，频率从880Hz快速滑向1200Hz，持续0.1秒
    playSound('square', 880, 1200, 0.1, 0.08);
  }

  /** 游戏结束音效：下降音调的“嗡”声（锯齿波，低沉） */
  function playGameOverSound() {
    // 锯齿波(sawtooth)音色偏悲伤，频率从300Hz滑降到50Hz，持续0.5秒
    playSound('sawtooth', 300, 50, 0.5, 0.15);
  }

  /** 转向/点击音效：非常轻微的点击声（正弦波） */
  function playClickSound() {
    // 正弦波(sine)音色柔和，频率从600Hz滑向400Hz，持续0.05秒，极轻
    playSound('sine', 600, 400, 0.05, 0.04);
  }

  /* =========================================================
   *  2. DOM 引用
   * ========================================================= */
  const canvas    = document.getElementById('game');
  const ctx       = canvas.getContext('2d');
  const scoreEl   = document.getElementById('score');
  const bestEl    = document.getElementById('best');
  const restartBtn= document.getElementById('restart');

  /* =========================================================
   *  3. 游戏状态变量
   * ========================================================= */
  let snake;
  let dir;
  let dirQueue;
  let food;
  let score;
  let best;
  let state;
  let lastTime = 0;
  let acc = 0;

  /* =========================================================
   *  4. 工具函数
   * ========================================================= */
  function roundRectPath(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y,     x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x,     y + h, r);
    ctx.arcTo(x,     y + h, x,     y,     r);
    ctx.arcTo(x,     y,     x + w, y,     r);
    ctx.closePath();
  }

  function loadBest() {
    const v = Number(localStorage.getItem(BEST_KEY));
    return Number.isFinite(v) && v > 0 ? v : 0;
  }

  /* =========================================================
   *  5. 初始化 / 重开
   * ========================================================= */
  function reset() {
    snake = [
      { x: 7, y: 10 },
      { x: 6, y: 10 },
      { x: 5, y: 10 }
    ];
    dir      = { x: 1, y: 0 };
    dirQueue = [];
    score    = 0;
    state    = 'running';
    acc      = 0;
    lastTime = 0;

    scoreEl.textContent = score;
    bestEl.textContent  = best;

    placeFood();
    draw();
    // 重新开始的时候也可以播放一个轻微的点击反馈（可选）
    // playClickSound();
  }

  /* =========================================================
   *  6. 食物生成
   * ========================================================= */
  function placeFood() {
    const empty = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const occupied = snake.some(seg => seg.x === x && seg.y === y);
        if (!occupied) empty.push({ x, y });
      }
    }
    if (empty.length === 0) return;
    food = empty[Math.floor(Math.random() * empty.length)];
  }

  /* =========================================================
   *  7. 方向控制（禁止 180° 掉头）
   * ========================================================= */
  function setDirection(nd) {
    const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
    if (nd.x === -last.x && nd.y === -last.y) return;
    if (nd.x === last.x && nd.y === last.y) return;
    
    if (dirQueue.length < 2) {
      dirQueue.push(nd);
      // 成功改变方向时，播放轻微点击声
      playClickSound();
    }
  }

  /* =========================================================
   *  8. 走一步
   * ========================================================= */
  function step() {
    if (dirQueue.length) dir = dirQueue.shift();

    const head = snake[0];
    const next = { x: head.x + dir.x, y: head.y + dir.y };

    if (next.x < 0 || next.x >= COLS || next.y < 0 || next.y >= ROWS) {
      gameOver();
      return;
    }

    const willGrow = (next.x === food.x && next.y === food.y);
    const body = willGrow ? snake : snake.slice(0, -1);

    if (body.some(seg => seg.x === next.x && seg.y === next.y)) {
      gameOver();
      return;
    }

    snake.unshift(next);

    if (willGrow) {
      score += 10;
      scoreEl.textContent = score;
      placeFood();
      // 吃到食物，播放音效
      playEatSound();
    } else {
      snake.pop();
    }
  }

  /* =========================================================
   *  9. 结束 / 暂停
   * ========================================================= */
  function gameOver() {
    state = 'over';
    // 游戏结束，播放音效
    playGameOverSound();
    
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem(BEST_KEY, String(best));
    }
  }

  function togglePause() {
    if (state === 'running') {
      state = 'paused';
    } else if (state === 'paused') {
      state = 'running';
    }
  }

  /* =========================================================
   *  10. 绘制
   * ========================================================= */
  function draw() {
    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = 'rgba(148, 163, 184, 0.10)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < COLS; i++) {
      const x = i * CELL + 0.5;
      ctx.moveTo(x, 0);
      ctx.lineTo(x, canvas.height);
    }
    for (let i = 1; i < ROWS; i++) {
      const y = i * CELL + 0.5;
      ctx.moveTo(0, y);
      ctx.lineTo(canvas.width, y);
    }
    ctx.stroke();

    drawFood();

    for (let i = snake.length - 1; i >= 0; i--) {
      const seg = snake[i];
      const isHead = (i === 0);
      ctx.fillStyle = isHead
        ? '#86efac'
        : `hsl(142, 66%, ${52 - Math.min(i * 1.8, 22)}%)`;
      roundRectPath(
        seg.x * CELL + 2,
        seg.y * CELL + 2,
        CELL - 4,
        CELL - 4,
        isHead ? 7 : 5
      );
      ctx.fill();
    }

    drawEyes();

    if (state === 'paused') {
      drawOverlay('已暂停', '按空格键继续 / 点击屏幕继续');
    } else if (state === 'over') {
      drawOverlay('游戏结束', '得分 ' + score + ' · 点击屏幕任意地方再来一局');
    }
  }

  function drawFood() {
    const cx = food.x * CELL + CELL / 2;
    const cy = food.y * CELL + CELL / 2;
    const r  = CELL / 2 - 3;

    const grad = ctx.createRadialGradient(cx - 3, cy - 3, 1, cx, cy, r + 2);
    grad.addColorStop(0, '#fca5a5');
    grad.addColorStop(1, '#dc2626');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.beginPath();
    ctx.arc(cx - 3, cy - 3, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawEyes() {
    const head = snake[0];
    if (!head) return;
    const cx = head.x * CELL + CELL / 2;
    const cy = head.y * CELL + CELL / 2;
    const fx = dir.x, fy = dir.y;
    const px = -fy, py = fx;
    const off = 4.5;

    ctx.fillStyle = '#0b1220';
    const eyes = [
      { x: cx + fx * 3 + px * off, y: cy + fy * 3 + py * off },
      { x: cx + fx * 3 - px * off, y: cy + fy * 3 - py * off }
    ];
    eyes.forEach(e => {
      ctx.beginPath();
      ctx.arc(e.x, e.y, 2, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawOverlay(title, subtitle) {
    ctx.fillStyle = 'rgba(2, 6, 23, 0.72)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e2e8f0';
    ctx.font = 'bold 30px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 18);
    ctx.fillStyle = '#94a3b8';
    ctx.font = '14px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 22);
  }

  /* =========================================================
   *  11. 主循环
   * ========================================================= */
  function loop(t) {
    if (!lastTime) lastTime = t;
    const dt = Math.min(t - lastTime, 200);
    lastTime = t;

    if (state === 'running') {
      acc += dt;
      while (acc >= STEP_TIME && state === 'running') {
        acc -= STEP_TIME;
        step();
      }
    }

    draw();
    requestAnimationFrame(loop);
  }

  /* =========================================================
   *  12. 键盘事件
   * ========================================================= */
  const KEY_MAP = {
    ArrowUp:    { x: 0,  y: -1 },
    ArrowDown:  { x: 0,  y: 1  },
    ArrowLeft:  { x: -1, y: 0  },
    ArrowRight: { x: 1,  y: 0  }
  };

  document.addEventListener('keydown', function (e) {
    // 【音效新增】任何键盘操作都尝试初始化音频（满足用户手势解锁要求）
    initAudio();

    if (e.key in KEY_MAP || e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
    }
    if (e.key === ' ' || e.code === 'Space') {
      togglePause();
      return;
    }
    const nd = KEY_MAP[e.key];
    if (!nd) return;
    if (state !== 'running') return;
    setDirection(nd);
  });

  /* =========================================================
   *  13. 触屏滑动控制
   * ========================================================= */
  let touchStartX = 0;
  let touchStartY = 0;
  let touchEndX = 0;
  let touchEndY = 0;

  const MIN_SWIPE_DISTANCE = 30;

  canvas.addEventListener('touchstart', function (e) {
    // 【音效新增】触屏操作时初始化音频
    initAudio();

    if (state !== 'running') return;
    const touch = e.touches[0];
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchend', function (e) {
    if (state !== 'running') return;
    const touch = e.changedTouches[0];
    touchEndX = touch.clientX;
    touchEndY = touch.clientY;
    handleSwipe();
    e.preventDefault();
  }, { passive: false });

  function handleSwipe() {
    const dx = touchEndX - touchStartX;
    const dy = touchEndY - touchStartY;

    if (Math.abs(dx) < MIN_SWIPE_DISTANCE && Math.abs(dy) < MIN_SWIPE_DISTANCE) {
      return;
    }

    if (Math.abs(dx) > Math.abs(dy)) {
      setDirection(dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 });
    } else {
      setDirection(dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 });
    }
  }

  /* =========================================================
   *  14. 四方向按键控制
   * ========================================================= */
  const DIR_MAP = {
    up:    { x: 0,  y: -1 },
    down:  { x: 0,  y: 1  },
    left:  { x: -1, y: 0  },
    right: { x: 1,  y: 0  }
  };

  const dpadBtns = document.querySelectorAll('.dpad-btn');

  dpadBtns.forEach(function (btn) {
    btn.addEventListener('pointerdown', function (e) {
      // 【音效新增】点击虚拟方向键时初始化音频
      initAudio();

      e.preventDefault();
      btn.classList.add('pressed');
      if (state !== 'running') return;
      const nd = DIR_MAP[btn.dataset.dir];
      if (nd) setDirection(nd);
    });

    btn.addEventListener('pointerup', function () {
      btn.classList.remove('pressed');
    });
    btn.addEventListener('pointerleave', function () {
      btn.classList.remove('pressed');
    });
    btn.addEventListener('pointercancel', function () {
      btn.classList.remove('pressed');
    });

    btn.addEventListener('contextmenu', function (e) {
      e.preventDefault();
    });
  });

  /* =========================================================
   *  15. 全局点击：游戏结束点击屏幕任意地方重新开始
   * ========================================================= */
  document.addEventListener('click', function (e) {
    // 全局点击时也尝试初始化音频（防漏）
    initAudio();

    if (e.target.closest('button')) return;

    if (state === 'over') {
      reset();
    } else if (state === 'paused') {
      togglePause();
    }
  });

  /* =========================================================
   *  16. 按钮事件 & 启动
   * ========================================================= */
  restartBtn.addEventListener('click', function () {
    // 【音效新增】点击重开按钮时也初始化音频
    initAudio();
    reset();
    restartBtn.blur();
  });

  window.addEventListener('blur', function () {
    if (state === 'running') state = 'paused';
  });

  best = loadBest();
  reset();
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>ss
