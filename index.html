<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇 · Snake</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #1e293b 0%, #020617 70%);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e2e8f0;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .game {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* 分数栏 */
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 14px;
    color: #94a3b8;
    letter-spacing: .5px;
  }
  .hud strong {
    color: #4ade80;
    font-size: 20px;
    margin-left: 6px;
    font-variant-numeric: tabular-nums;
  }

  canvas {
    display: block;
    width: 400px;
    height: 400px;
    border-radius: 12px;
    background: #0b1220;
    box-shadow: 0 0 0 1px rgba(148, 163, 184, .18), 0 18px 40px rgba(0, 0, 0, .55);
  }

  /* 底部操作栏 */
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  button {
    padding: 9px 18px;
    font-size: 14px;
    font-family: inherit;
    color: #052e16;
    background: linear-gradient(180deg, #86efac, #4ade80);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: transform .08s ease, filter .15s ease;
  }
  button:hover { filter: brightness(1.06); }
  button:active { transform: translateY(1px) scale(.98); }

  .tip {
    font-size: 12px;
    color: #64748b;
    text-align: right;
    line-height: 1.5;
  }
</style>
</head>
<body>

  <div class="game">
    <header class="hud">
      <div>分数<strong id="score">0</strong></div>
      <div>最高分<strong id="best">0</strong></div>
    </header>

    <canvas id="game" width="400" height="400"></canvas>

    <footer class="bar">
      <button id="restart">重新开始</button>
      <span class="tip">方向键移动 · 空格暂停/继续</span>
    </footer>
  </div>

<script>
(function () {
  'use strict';

  /* =========================================================
   *  1. 基础配置
   * ========================================================= */
  const COLS = 20;                 // 横向格子数
  const ROWS = 20;                 // 纵向格子数
  const CELL = 20;                 // 每格像素（400 / 20）
  const STEP_TIME = 120;           // 蛇每走一步的毫秒数（数值越小越快）
  const BEST_KEY = 'snake_best_score'; // localStorage 存储键

  /* =========================================================
   *  2. DOM 引用
   * ========================================================= */
  const canvas    = document.getElementById('game');
  const ctx       = canvas.getContext('2d');
  const scoreEl   = document.getElementById('score');
  const bestEl    = document.getElementById('best');
  const restartBtn= document.getElementById('restart');

  /* =========================================================
   *  3. 游戏状态变量
   * ========================================================= */
  let snake;            // 蛇身数组，snake[0] 是蛇头，元素形如 {x, y}
  let dir;              // 当前移动方向 {x, y}
  let dirQueue;         // 方向输入队列（防止一帧内连按导致反向）
  let food;             // 食物坐标 {x, y}
  let score;            // 当前分数
  let best;             // 历史最高分
  let state;            // 游戏状态：'running' | 'paused' | 'over'
  let lastTime = 0;     // 上一帧时间戳
  let acc = 0;          // 时间累加器（用于固定步长移动）

  /* =========================================================
   *  4. 工具函数
   * ========================================================= */

  /** 绘制圆角矩形路径 */
  function roundRectPath(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y,     x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x,     y + h, r);
    ctx.arcTo(x,     y + h, x,     y,     r);
    ctx.arcTo(x,     y,     x + w, y,     r);
    ctx.closePath();
  }

  /** 从 localStorage 读取最高分 */
  function loadBest() {
    const v = Number(localStorage.getItem(BEST_KEY));
    return Number.isFinite(v) && v > 0 ? v : 0;
  }

  /* =========================================================
   *  5. 初始化 / 重开
   * ========================================================= */
  function reset() {
    // 蛇初始长度 3，位于中间偏左，朝右
    snake = [
      { x: 7, y: 10 },  // 头
      { x: 6, y: 10 },
      { x: 5, y: 10 }   // 尾
    ];

    dir      = { x: 1, y: 0 };  // 初始方向：向右
    dirQueue = [];
    score    = 0;
    state    = 'running';
    acc      = 0;
    lastTime = 0;

    scoreEl.textContent = score;
    bestEl.textContent  = best;

    placeFood();  // 生成第一个食物
    draw();       // 立即绘制一帧，避免闪烁
  }

  /* =========================================================
   *  6. 食物生成（不能生成在蛇身上）
   * ========================================================= */
  function placeFood() {
    // 收集所有空格子
    const empty = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const occupied = snake.some(seg => seg.x === x && seg.y === y);
        if (!occupied) empty.push({ x, y });
      }
    }
    if (empty.length === 0) return; // 理论上满屏才会发生（通关）
    food = empty[Math.floor(Math.random() * empty.length)];
  }

  /* =========================================================
   *  7. 方向控制（禁止 180° 掉头）
   * ========================================================= */
  function setDirection(nd) {
    // 以「队列中最后一个待执行方向」为基准判断，避免连续快速按键出 bug
    const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;

    // 反向：直接忽略
    if (nd.x === -last.x && nd.y === -last.y) return;
    // 同向：忽略
    if (nd.x === last.x && nd.y === last.y) return;

    // 队列最多缓存 2 个输入
    if (dirQueue.length < 2) dirQueue.push(nd);
  }

  /* =========================================================
   *  8. 走一步（核心逻辑）
   * ========================================================= */
  function step() {
    // 取出一个待执行方向
    if (dirQueue.length) dir = dirQueue.shift();

    const head = snake[0];
    const next = { x: head.x + dir.x, y: head.y + dir.y };

    // --- 撞墙判定 ---
    if (next.x < 0 || next.x >= COLS || next.y < 0 || next.y >= ROWS) {
      gameOver();
      return;
    }

    // 是否吃到食物（决定这一帧尾巴是否移动）
    const willGrow = (next.x === food.x && next.y === food.y);

    // --- 撞自己判定 ---
    // 若不吃食物，尾巴会移开，因此尾节点不算障碍
    const body = willGrow ? snake : snake.slice(0, -1);
    if (body.some(seg => seg.x === next.x && seg.y === next.y)) {
      gameOver();
      return;
    }

    // 前进：头插入新格子
    snake.unshift(next);

    if (willGrow) {
      // 吃到食物：加分、变长（不删尾巴）、重新生成食物
      score += 10;
      scoreEl.textContent = score;
      placeFood();
    } else {
      // 正常移动：删掉尾巴
      snake.pop();
    }
  }

  /* =========================================================
   *  9. 结束 / 暂停
   * ========================================================= */
  function gameOver() {
    state = 'over';
    // 更新最高分并写入 localStorage
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem(BEST_KEY, String(best));
    }
  }

  function togglePause() {
    if (state === 'running') {
      state = 'paused';
    } else if (state === 'paused') {
      state = 'running';
    }
  }

  /* =========================================================
   *  10. 绘制
   * ========================================================= */
  function draw() {
    // --- 背景 ---
    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // --- 网格线 ---
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.10)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < COLS; i++) {
      const x = i * CELL + 0.5;
      ctx.moveTo(x, 0);
      ctx.lineTo(x, canvas.height);
    }
    for (let i = 1; i < ROWS; i++) {
      const y = i * CELL + 0.5;
      ctx.moveTo(0, y);
      ctx.lineTo(canvas.width, y);
    }
    ctx.stroke();

    // --- 食物 ---
    drawFood();

    // --- 蛇（从尾到头绘制，保证蛇头在最上层）---
    for (let i = snake.length - 1; i >= 0; i--) {
      const seg = snake[i];
      const isHead = (i === 0);

      ctx.fillStyle = isHead
        ? '#86efac'
        : `hsl(142, 66%, ${52 - Math.min(i * 1.8, 22)}%)`;

      roundRectPath(
        seg.x * CELL + 2,
        seg.y * CELL + 2,
        CELL - 4,
        CELL - 4,
        isHead ? 7 : 5
      );
      ctx.fill();
    }

    drawEyes();

    // --- 状态遮罩 ---
    if (state === 'paused') {
      drawOverlay('已暂停', '按空格键继续');
    } else if (state === 'over') {
      drawOverlay('游戏结束', '得分 ' + score + ' · 点击「重新开始」再来一局');
    }
  }

  /** 画食物（带渐变的小红球） */
  function drawFood() {
    const cx = food.x * CELL + CELL / 2;
    const cy = food.y * CELL + CELL / 2;
    const r  = CELL / 2 - 3;

    const grad = ctx.createRadialGradient(cx - 3, cy - 3, 1, cx, cy, r + 2);
    grad.addColorStop(0, '#fca5a5');
    grad.addColorStop(1, '#dc2626');

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();

    // 高光
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.beginPath();
    ctx.arc(cx - 3, cy - 3, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  /** 画蛇眼睛（跟随当前移动方向） */
  function drawEyes() {
    const head = snake[0];
    if (!head) return;

    const cx = head.x * CELL + CELL / 2;
    const cy = head.y * CELL + CELL / 2;

    const fx = dir.x, fy = dir.y;      // 前方单位向量
    const px = -fy,   py = fx;         // 垂直单位向量
    const off = 4.5;                   // 眼睛左右偏移

    ctx.fillStyle = '#0b1220';
    const eyes = [
      { x: cx + fx * 3 + px * off, y: cy + fy * 3 + py * off },
      { x: cx + fx * 3 - px * off, y: cy + fy * 3 - py * off }
    ];
    eyes.forEach(e => {
      ctx.beginPath();
      ctx.arc(e.x, e.y, 2, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  /** 画居中的半透明提示层 */
  function drawOverlay(title, subtitle) {
    ctx.fillStyle = 'rgba(2, 6, 23, 0.72)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillStyle = '#e2e8f0';
    ctx.font = 'bold 30px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 18);

    ctx.fillStyle = '#94a3b8';
    ctx.font = '14px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 22);
  }

  /* =========================================================
   *  11. 主循环（requestAnimationFrame + 固定步长）
   * ========================================================= */
  function loop(t) {
    if (!lastTime) lastTime = t;
    // 限制单帧时间，防止切换标签页回来后「瞬移」
    const dt = Math.min(t - lastTime, 200);
    lastTime = t;

    if (state === 'running') {
      acc += dt;
      while (acc >= STEP_TIME && state === 'running') {
        acc -= STEP_TIME;
        step();
      }
    }

    draw();
    requestAnimationFrame(loop);
  }

  /* =========================================================
   *  12. 键盘事件
   * ========================================================= */
  const KEY_MAP = {
    ArrowUp:    { x: 0,  y: -1 },
    ArrowDown:  { x: 0,  y: 1  },
    ArrowLeft:  { x: -1, y: 0  },
    ArrowRight: { x: 1,  y: 0  }
  };

  document.addEventListener('keydown', function (e) {
    // 阻止方向键滚动页面、空格滚动页面
    if (e.key in KEY_MAP || e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
    }

    // 空格：暂停 / 继续
    if (e.key === ' ' || e.code === 'Space') {
      togglePause();
      return;
    }

    const nd = KEY_MAP[e.key];
    if (!nd) return;
    if (state !== 'running') return; // 暂停或结束时不允许转向

    setDirection(nd);
  });

  // 切到其他窗口时自动暂停，避免回来就撞死
  window.addEventListener('blur', function () {
    if (state === 'running') state = 'paused';
  });

  /* =========================================================
   *  13. 按钮事件 & 启动
   * ========================================================= */
  restartBtn.addEventListener('click', function () {
    reset();
    restartBtn.blur(); // 防止按钮保持焦点后被空格触发
  });

  best = loadBest();
  reset();
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
