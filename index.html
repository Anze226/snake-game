<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 禁止手机页面缩放 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>贪吃蛇 · Snake</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #1e293b 0%, #020617 70%);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e2e8f0;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .game {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 420px;
    padding: 10px;
  }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 14px;
    color: #94a3b8;
    letter-spacing: .5px;
  }
  .hud strong {
    color: #4ade80;
    font-size: 20px;
    margin-left: 6px;
    font-variant-numeric: tabular-nums;
  }

  canvas {
    display: block;
    width: 100%;
    max-width: 400px;
    height: auto;
    aspect-ratio: 1 / 1;
    margin: 0 auto;
    border-radius: 12px;
    background: #0b1220;
    box-shadow: 0 0 0 1px rgba(148, 163, 184, .18), 0 18px 40px rgba(0, 0, 0, .55);
    touch-action: none;
  }

  /* ==================== 四方向按键 ==================== */
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 8px;
    justify-content: center;
    margin: 4px auto 0;
  }

  /* 按钮在网格中的位置：上、左、右、下 */
  .dpad-btn[data-dir="up"]    { grid-column: 2; grid-row: 1; }
  .dpad-btn[data-dir="left"]  { grid-column: 1; grid-row: 2; }
  .dpad-btn[data-dir="right"] { grid-column: 3; grid-row: 2; }
  .dpad-btn[data-dir="down"]  { grid-column: 2; grid-row: 3; }

  /* 覆盖全局 button 样式，让方向键按钮用暗色风格 */
  .dpad-btn {
    width: 56px;
    height: 56px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    line-height: 1;
    color: #4ade80;
    background: #1e293b;
    border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 12px;
    cursor: pointer;
    touch-action: manipulation;
    transition: background .1s ease, transform .06s ease;
  }
  .dpad-btn:hover  { background: #243449; }
  /* 按下时的反馈（:active 在桌面端鼠标点击时生效） */
  .dpad-btn:active { background: #334155; transform: scale(.94); }
  /* 触屏按下时的即时视觉反馈 */
  .dpad-btn.pressed {
    background: #334155;
    transform: scale(.94);
  }

  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  /* 全局 button 基础样式（只作用于“重新开始”按钮） */
  button {
    padding: 9px 18px;
    font-size: 14px;
    font-family: inherit;
    color: #052e16;
    background: linear-gradient(180deg, #86efac, #4ade80);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: transform .08s ease, filter .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  button:hover { filter: brightness(1.06); }
  button:active { transform: translateY(1px) scale(.98); }

  .tip {
    font-size: 12px;
    color: #64748b;
    text-align: right;
    line-height: 1.5;
  }
</style>
</head>
<body>

  <div class="game">
    <header class="hud">
      <div>分数<strong id="score">0</strong></div>
      <div>最高分<strong id="best">0</strong></div>
    </header>

    <canvas id="game" width="400" height="400"></canvas>

    <!-- 四方向按键：data-dir 属性标记方向，由 JS 统一处理 -->
    <div class="dpad">
      <button class="dpad-btn" data-dir="up"    aria-label="向上">▲</button>
      <button class="dpad-btn" data-dir="left"  aria-label="向左">◀</button>
      <button class="dpad-btn" data-dir="right" aria-label="向右">▶</button>
      <button class="dpad-btn" data-dir="down"  aria-label="向下">▼</button>
    </div>

    <footer class="bar">
      <button id="restart">重新开始</button>
      <span class="tip">方向键 / 滑动屏幕控制<br>空格暂停/继续</span>
    </footer>
  </div>

<script>
(function () {
  'use strict';

  /* =========================================================
   *  1. 基础配置
   * ========================================================= */
  const COLS = 20;
  const ROWS = 20;
  const CELL = 20;
  /* 【速度调整】原值 120，现改为 150，数值越大蛇走得越慢 */
  const STEP_TIME = 150;
  const BEST_KEY = 'snake_best_score';

  /* =========================================================
   *  2. DOM 引用
   * ========================================================= */
  const canvas    = document.getElementById('game');
  const ctx       = canvas.getContext('2d');
  const scoreEl   = document.getElementById('score');
  const bestEl    = document.getElementById('best');
  const restartBtn= document.getElementById('restart');

  /* =========================================================
   *  3. 游戏状态变量
   * ========================================================= */
  let snake;
  let dir;
  let dirQueue;
  let food;
  let score;
  let best;
  let state;            // 'running' | 'paused' | 'over'
  let lastTime = 0;
  let acc = 0;

  /* =========================================================
   *  4. 工具函数
   * ========================================================= */
  function roundRectPath(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y,     x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x,     y + h, r);
    ctx.arcTo(x,     y + h, x,     y,     r);
    ctx.arcTo(x,     y,     x + w, y,     r);
    ctx.closePath();
  }

  function loadBest() {
    const v = Number(localStorage.getItem(BEST_KEY));
    return Number.isFinite(v) && v > 0 ? v : 0;
  }

  /* =========================================================
   *  5. 初始化 / 重开
   * ========================================================= */
  function reset() {
    snake = [
      { x: 7, y: 10 },
      { x: 6, y: 10 },
      { x: 5, y: 10 }
    ];
    dir      = { x: 1, y: 0 };
    dirQueue = [];
    score    = 0;
    state    = 'running';
    acc      = 0;
    lastTime = 0;

    scoreEl.textContent = score;
    bestEl.textContent  = best;

    placeFood();
    draw();
  }

  /* =========================================================
   *  6. 食物生成
   * ========================================================= */
  function placeFood() {
    const empty = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const occupied = snake.some(seg => seg.x === x && seg.y === y);
        if (!occupied) empty.push({ x, y });
      }
    }
    if (empty.length === 0) return;
    food = empty[Math.floor(Math.random() * empty.length)];
  }

  /* =========================================================
   *  7. 方向控制（禁止 180° 掉头）
   * ========================================================= */
  function setDirection(nd) {
    const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
    if (nd.x === -last.x && nd.y === -last.y) return; // 反向无效
    if (nd.x === last.x && nd.y === last.y) return;    // 同向忽略
    if (dirQueue.length < 2) dirQueue.push(nd);
  }

  /* =========================================================
   *  8. 走一步
   * ========================================================= */
  function step() {
    if (dirQueue.length) dir = dirQueue.shift();

    const head = snake[0];
    const next = { x: head.x + dir.x, y: head.y + dir.y };

    // 撞墙
    if (next.x < 0 || next.x >= COLS || next.y < 0 || next.y >= ROWS) {
      gameOver();
      return;
    }

    const willGrow = (next.x === food.x && next.y === food.y);
    const body = willGrow ? snake : snake.slice(0, -1);

    // 撞自己
    if (body.some(seg => seg.x === next.x && seg.y === next.y)) {
      gameOver();
      return;
    }

    snake.unshift(next);

    if (willGrow) {
      score += 10;
      scoreEl.textContent = score;
      placeFood();
    } else {
      snake.pop();
    }
  }

  /* =========================================================
   *  9. 结束 / 暂停
   * ========================================================= */
  function gameOver() {
    state = 'over';
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem(BEST_KEY, String(best));
    }
  }

  function togglePause() {
    if (state === 'running') {
      state = 'paused';
    } else if (state === 'paused') {
      state = 'running';
    }
  }

  /* =========================================================
   *  10. 绘制
   * ========================================================= */
  function draw() {
    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 网格线
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.10)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < COLS; i++) {
      const x = i * CELL + 0.5;
      ctx.moveTo(x, 0);
      ctx.lineTo(x, canvas.height);
    }
    for (let i = 1; i < ROWS; i++) {
      const y = i * CELL + 0.5;
      ctx.moveTo(0, y);
      ctx.lineTo(canvas.width, y);
    }
    ctx.stroke();

    drawFood();

    for (let i = snake.length - 1; i >= 0; i--) {
      const seg = snake[i];
      const isHead = (i === 0);
      ctx.fillStyle = isHead
        ? '#86efac'
        : `hsl(142, 66%, ${52 - Math.min(i * 1.8, 22)}%)`;
      roundRectPath(
        seg.x * CELL + 2,
        seg.y * CELL + 2,
        CELL - 4,
        CELL - 4,
        isHead ? 7 : 5
      );
      ctx.fill();
    }

    drawEyes();

    if (state === 'paused') {
      drawOverlay('已暂停', '按空格键继续 / 点击继续');
    } else if (state === 'over') {
      drawOverlay('游戏结束', '得分 ' + score + ' · 点击「重新开始」再来一局');
    }
  }

  function drawFood() {
    const cx = food.x * CELL + CELL / 2;
    const cy = food.y * CELL + CELL / 2;
    const r  = CELL / 2 - 3;

    const grad = ctx.createRadialGradient(cx - 3, cy - 3, 1, cx, cy, r + 2);
    grad.addColorStop(0, '#fca5a5');
    grad.addColorStop(1, '#dc2626');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.beginPath();
    ctx.arc(cx - 3, cy - 3, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawEyes() {
    const head = snake[0];
    if (!head) return;
    const cx = head.x * CELL + CELL / 2;
    const cy = head.y * CELL + CELL / 2;
    const fx = dir.x, fy = dir.y;
    const px = -fy, py = fx;
    const off = 4.5;

    ctx.fillStyle = '#0b1220';
    const eyes = [
      { x: cx + fx * 3 + px * off, y: cy + fy * 3 + py * off },
      { x: cx + fx * 3 - px * off, y: cy + fy * 3 - py * off }
    ];
    eyes.forEach(e => {
      ctx.beginPath();
      ctx.arc(e.x, e.y, 2, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawOverlay(title, subtitle) {
    ctx.fillStyle = 'rgba(2, 6, 23, 0.72)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e2e8f0';
    ctx.font = 'bold 30px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 18);
    ctx.fillStyle = '#94a3b8';
    ctx.font = '14px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 22);
  }

  /* =========================================================
   *  11. 主循环
   * ========================================================= */
  function loop(t) {
    if (!lastTime) lastTime = t;
    const dt = Math.min(t - lastTime, 200);
    lastTime = t;

    if (state === 'running') {
      acc += dt;
      while (acc >= STEP_TIME && state === 'running') {
        acc -= STEP_TIME;
        step();
      }
    }

    draw();
    requestAnimationFrame(loop);
  }

  /* =========================================================
   *  12. 键盘事件（保留电脑端操作）
   * ========================================================= */
  const KEY_MAP = {
    ArrowUp:    { x: 0,  y: -1 },
    ArrowDown:  { x: 0,  y: 1  },
    ArrowLeft:  { x: -1, y: 0  },
    ArrowRight: { x: 1,  y: 0  }
  };

  document.addEventListener('keydown', function (e) {
    if (e.key in KEY_MAP || e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
    }
    if (e.key === ' ' || e.code === 'Space') {
      togglePause();
      return;
    }
    const nd = KEY_MAP[e.key];
    if (!nd) return;
    if (state !== 'running') return;
    setDirection(nd);
  });

  /* =========================================================
   *  13. 触屏滑动控制
   * ========================================================= */
  let touchStartX = 0;
  let touchStartY = 0;
  let touchEndX = 0;
  let touchEndY = 0;

  const MIN_SWIPE_DISTANCE = 30; // 滑动阈值，防止轻触误触发

  canvas.addEventListener('touchstart', function (e) {
    if (state !== 'running') return;
    const touch = e.touches[0];
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault(); // 阻止手指滑动时拖动整个页面
  }, { passive: false });

  canvas.addEventListener('touchend', function (e) {
    if (state !== 'running') return;
    const touch = e.changedTouches[0];
    touchEndX = touch.clientX;
    touchEndY = touch.clientY;
    handleSwipe();
    e.preventDefault();
  }, { passive: false });

  /**
   * 滑动方向判断：
   * dx = 终点X - 起点X，dy = 终点Y - 起点Y
   * 若 |dx| > |dy| 则判定为水平滑动，否则为垂直滑动
   * 再根据 dx / dy 的正负号决定具体方向
   * setDirection 内部已经处理了 180° 掉头限制
   */
  function handleSwipe() {
    const dx = touchEndX - touchStartX;
    const dy = touchEndY - touchStartY;

    if (Math.abs(dx) < MIN_SWIPE_DISTANCE && Math.abs(dy) < MIN_SWIPE_DISTANCE) {
      return; // 滑动距离太小，视为误触
    }

    if (Math.abs(dx) > Math.abs(dy)) {
      setDirection(dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 });
    } else {
      setDirection(dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 });
    }
  }

  /* =========================================================
   *  14. 四方向按键控制
   * ========================================================= */
  const DIR_MAP = {
    up:    { x: 0,  y: -1 },
    down:  { x: 0,  y: 1  },
    left:  { x: -1, y: 0  },
    right: { x: 1,  y: 0  }
  };

  const dpadBtns = document.querySelectorAll('.dpad-btn');

  dpadBtns.forEach(function (btn) {
    // 使用 pointerdown：桌面鼠标点击和移动端触摸都会触发，响应更及时
    btn.addEventListener('pointerdown', function (e) {
      e.preventDefault(); // 阻止移动端产生重复的 click / 双击缩放

      // 添加按压视觉反馈
      btn.classList.add('pressed');

      if (state !== 'running') return;

      const nd = DIR_MAP[btn.dataset.dir];
      if (nd) setDirection(nd);
    });

    // 松开手指 / 鼠标时移除按压效果
    btn.addEventListener('pointerup', function () {
      btn.classList.remove('pressed');
    });
    btn.addEventListener('pointerleave', function () {
      btn.classList.remove('pressed');
    });
    btn.addEventListener('pointercancel', function () {
      btn.classList.remove('pressed');
    });

    // 长按不弹出右键菜单
    btn.addEventListener('contextmenu', function (e) {
      e.preventDefault();
    });
  });

  /* =========================================================
   *  15. 按钮事件 & 启动
   * ========================================================= */
  restartBtn.addEventListener('click', function () {
    reset();
    restartBtn.blur();
  });

  window.addEventListener('blur', function () {
    if (state === 'running') state = 'paused';
  });

  best = loadBest();
  reset();
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
